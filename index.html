<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta Cumpleaños</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #ffe9f5);
    font-family: 'Segoe UI', sans-serif;
}

/* SOBRE */
.envelope {
    width: 300px;
    height: 200px;
    background: #ff99cc;
    position: relative;
    cursor: pointer;
    border-radius: 10px;
    transition: 1s;
}

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff66b2;
    clip-path: polygon(0 0, 100% 0, 50% 50%);
    transition: 1s;
}

.open .flap {
    transform: rotateX(180deg);
}

/* CARTA */
.card {
    position: absolute;
    width: 280px;
    height: 350px;
    background: white;
    top: -400px;
    left: 10px;
    border-radius: 20px;
    text-align: center;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 1s;
}

.open .card {
    top: -180px;
}

/* PASTEL */
.cake {
    position: relative;
    width: 150px;
    height: 120px;
    margin: 20px auto;
}

.layer {
    position: absolute;
    width: 150px;
    height: 40px;
    background: #ff85c1;
    border-radius: 10px;
}

.layer:nth-child(1) { bottom: 0; }
.layer:nth-child(2) { bottom: 35px; background: #ffaad4; }
.layer:nth-child(3) { bottom: 70px; background: #ffc2e0; }

/* DECORACION */
.drip {
    position: absolute;
    width: 20px;
    height: 25px;
    background: white;
    border-radius: 50%;
    top: 0;
}

.drip:nth-child(4) { left: 20px; }
.drip:nth-child(5) { left: 60px; }
.drip:nth-child(6) { left: 100px; }

/* VELAS */
.candle {
    position: absolute;
    width: 10px;
    height: 30px;
    background: #fff;
    top: -30px;
}

.candle:nth-child(7) { left: 30px; }
.candle:nth-child(8) { left: 70px; }
.candle:nth-child(9) { left: 110px; }

.flame {
    width: 10px;
    height: 15px;
    background: orange;
    border-radius: 50%;
    position: absolute;
    top: -15px;
    opacity: 0;
}

.encendida {
    opacity: 1;
    animation: flame 0.5s infinite alternate;
}

@keyframes flame {
    from { transform: scale(1); }
    to { transform: scale(1.3); }
}

h2 {
    color: #ff4da6;
}
</style>
</head>

<body>

<div class="envelope" onclick="abrirCarta(this)">
    <div class="flap"></div>

    <div class="card">
        <h2>🎉 Feliz cumpleaños Miyelito 🎉</h2>

        <div class="cake">
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="layer"></div>

            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>

            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
        </div>

        <p>Que tu día esté lleno de magia, amor y sonrisas 💖✨</p>
    </div>
</div>

<script>
function abrirCarta(elemento) {
    elemento.classList.toggle("open");

    let llamas = document.querySelectorAll(".flame");
    llamas.forEach((flama, i) => {
        setTimeout(() => {
            flama.classList.add("encendida");
        }, i * 400);
    });
}
</script>

</body>
</html>
